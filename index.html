<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Wrapped | Your Year in Code</title>
  <meta name="description"
    content="Generate your GitHub Wrapped! See your contribution graph, developer persona, top languages, and shipped features. Celebrate your coding journey.">
  <meta name="keywords"
    content="github wrapped, year in code, developer stats, coding statistics, github visualization">

  <link rel="stylesheet" href="css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700;800&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="content" class="main-container"></div>

  <!-- Configuration & Constants -->
  <script src="js/config.js"></script>

  <!-- Utilities -->
  <script src="js/utils/date.js"></script>
  <script src="js/utils/format.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/utils/cache.js"></script>

  <!-- API & Data Layer -->
  <script src="js/api/github.js"></script>
  <script src="js/data/extractor.js"></script>
  <script src="js/data/analyzer.js"></script>
  <script src="js/data/snapshot.js"></script>

  <!-- UI Sections -->
  <script src="js/ui/sections/header.js"></script>
  <script src="js/ui/sections/contribution-graph.js"></script>
  <script src="js/ui/sections/stats.js"></script>
  <script src="js/ui/sections/code-footprint.js"></script>
  <script src="js/ui/sections/time-patterns.js"></script>
  <script src="js/ui/sections/highlights.js"></script>
  <script src="js/ui/sections/collaboration.js"></script>
  <script src="js/ui/sections/persona.js"></script>
  <script src="js/ui/sections/top-repos.js"></script>
  <script src="js/ui/sections/cta.js"></script>

  <!-- UI Pages -->
  <script src="js/ui/input-form.js"></script>
  <script src="js/ui/results.js"></script>
  <script src="js/ui/pdf-generator.js"></script>

  <!-- PDF Library (from CDN) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- Main App -->
  <script src="js/main.js"></script>
</body>

</html>
